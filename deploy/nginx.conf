server {
    listen 8090;   # 对外端口：默认 8090，避免与已占 80 端口的服务（如 Docker demo）冲突；deploy.sh 可用 APP_PORT 覆盖
    server_name _;   # 有域名后改成域名并 certbot

    # 前端静态
    root /opt/personal_work_rag/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}

# 有域名后启用 HTTPS（certbot 会自动改写此文件）：
#   sudo certbot --nginx -d your.domain.com
