<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人知识库 · FAQ 匹配</title>
<script src="https://unpkg.com/vue@3.4.27/dist/vue.global.prod.js"></script>
<style>
/* ============ 设计变量（默认主题：雾灰） ============ */
:root {
  --bg: #f1f5f9;
  --card: #ffffff;
  --card-shadow: 0 2px 10px rgba(15,23,42,.05);
  --text: #0f172a;
  --text-2: #64748b;
  --text-3: #94a3b8;
  --border: #cbd5e1;
  --border-soft: #e2e8f0;
  --hover: #f1f5f9;
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-soft: #eef2ff;
  --primary-border: #c7d2fe;
  --primary-text: #3730a3;
  --on-primary: #ffffff;
  --nav-bg: #0f172a;
  --nav-item: #1e293b;
  --nav-text: #cbd5e1;
  --nav-text-dim: #94a3b8;
  --nav-border: #475569;
  --nav-select-bg: #1e293b;
  --nav-select-text: #e2e8f0;
  --success: #15803d;
  --success-bg: #dcfce7;
  --success-border: #86efac;
  --warn: #b45309;
  --warn-bg: #fef3c7;
  --warn-border: #fcd34d;
  --miss: #ea580c;
  --miss-bg: #fff7ed;
  --miss-border: #fed7aa;
  --danger: #dc2626;
  --danger-bg: #fee2e2;
  --danger-border: #fca5a5;
  --input-bg: #ffffff;
  --input-border: #cbd5e1;
  --th-bg: #f8fafc;
  --mask: rgba(15,23,42,.35);
  --pre-bg: #0f172a;
  --pre-text: #a5f3fc;
}
/* ============ 清新主题预设 ============ */
[data-theme="mint"] { --bg:#eaf7f2; --hover:#e3f3ed; --primary:#0d9488; --primary-hover:#0f766e; --primary-soft:#d9f2ec; --primary-border:#9fdfd2; --primary-text:#115e59; --nav-bg:#134e4a; --nav-item:#115e59; --nav-border:#2d6f68; --nav-select-bg:#115e59; }
[data-theme="sky"]  { --bg:#ebf4fc; --hover:#e2effa; --primary:#0284c7; --primary-hover:#0369a1; --primary-soft:#dbeefe; --primary-border:#a8d8f5; --primary-text:#075985; --nav-bg:#0c4a6e; --nav-item:#075985; --nav-border:#1e6091; --nav-select-bg:#075985; }
[data-theme="sakura"] { --bg:#fbf2f5; --hover:#f7e9ee; --primary:#db2777; --primary-hover:#be185d; --primary-soft:#fce4ef; --primary-border:#f5bcd6; --primary-text:#9d174d; --nav-bg:#831843; --nav-item:#9d174d; --nav-border:#b04a75; --nav-select-bg:#9d174d; }
[data-theme="cream"] { --bg:#f6f1e7; --hover:#f0e9db; --primary:#b45309; --primary-hover:#92400e; --primary-soft:#f8eccc; --primary-border:#ecd9a8; --primary-text:#92400e; --nav-bg:#443722; --nav-item:#5c4a2d; --nav-border:#6e5a3a; --nav-select-bg:#5c4a2d; }
[data-theme="dark"] {
  --bg:#0b1220; --card:#151e31; --card-shadow:0 2px 12px rgba(0,0,0,.45);
  --text:#e2e8f0; --text-2:#94a3b8; --text-3:#64748b;
  --border:#334155; --border-soft:#263349; --hover:#1c2740;
  --primary:#818cf8; --primary-hover:#6366f1; --primary-soft:#232c55; --primary-border:#3b4370; --primary-text:#c7d2fe; --on-primary:#ffffff;
  --nav-bg:#0f172a; --nav-item:#1e293b;
  --success:#4ade80; --success-bg:#12301e; --success-border:#166534;
  --warn:#fbbf24; --warn-bg:#33230a; --warn-border:#92400e;
  --miss:#fb923c; --miss-bg:#331b0a; --miss-border:#7c2d12;
  --danger:#f87171; --danger-bg:#371414; --danger-border:#7f1d1d;
  --input-bg:#1a2438; --input-border:#334155;
  --th-bg:#1a2438; --mask:rgba(0,0,0,.55); --pre-bg:#020617;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-base, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif); background: var(--bg); color: var(--text); transition: background .25s ease, color .25s ease; }
/* 字体方案：纯系统字体栈，无网络依赖，缺字体自动回退 */
:root { --font-base: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif; }
html[data-font="heiti"] { --font-base: "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
html[data-font="songti"] { --font-base: Georgia, "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif; }
html[data-font="kaiti"]  { --font-base: "Kaiti SC", STKaiti, KaiTi, 楷体, "Noto Serif SC", serif; }
html[data-font="yuan"]   { --font-base: "Yuanti SC", "YouYuan", 幼圆, "Varela Round", "Microsoft YaHei", sans-serif; }
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.login-card { background: var(--card); padding: 36px 40px; border-radius: 16px; box-shadow: 0 8px 30px rgba(15,23,42,.08); width: 360px; }
.login-card h2 { font-size: 20px; margin-bottom: 6px; }
.login-card p { font-size: 13px; color: var(--text-2); margin-bottom: 22px; }
.nav { background: var(--nav-bg); color: #fff; padding: 0 24px; display: flex; align-items: center; gap: 4px; height: 56px; position: sticky; top: 0; z-index: 10; transition: background .25s ease; }
.nav .brand { font-weight: 700; margin-right: 20px; font-size: 15px; }
.nav button.page-btn { background: none; border: none; color: var(--nav-text); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.nav button.page-btn.active, .nav button.page-btn:hover { background: var(--nav-item); color: #fff; }
.nav .spacer { flex: 1; }
.nav .kb-select, .nav .theme-select { background: var(--nav-select-bg); color: var(--nav-select-text); border: 1px solid var(--nav-border); border-radius: 8px; padding: 6px 10px; font-size: 13px; max-width: 180px; cursor: pointer; }
.nav .kb-op { background: none; border: 1px solid var(--nav-border); color: var(--nav-text); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 13px; line-height: 1.4; transition: background .15s ease, color .15s ease; }
.nav .kb-op:hover:not(:disabled) { background: var(--nav-item); color: #fff; }
.nav .kb-op:disabled { opacity: .45; cursor: not-allowed; }
.nav .theme-select { max-width: 118px; }
/* 汉堡菜单（主题/字体/退出收纳） */
.nav-menu { position: relative; margin-left: 6px; }
.nav-burger { width: 36px; height: 34px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; background: none; border: 1px solid transparent; border-radius: 8px; cursor: pointer; padding: 0; transition: background .15s ease, border-color .15s ease; }
.nav-burger span { display: block; width: 16px; height: 2px; border-radius: 2px; background: var(--nav-text); transition: transform .2s ease, opacity .2s ease; }
.nav-burger:hover, .nav-burger.open { background: var(--nav-item); border-color: var(--nav-border); }
.nav-burger.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.nav-burger.open span:nth-child(2) { opacity: 0; }
.nav-burger.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
.nav-pop-mask { position: fixed; inset: 0; z-index: 40; }
.nav-pop { position: absolute; top: calc(100% + 10px); right: 0; z-index: 41; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: 0 10px 28px rgba(0,0,0,.18); min-width: 232px; animation: pageIn .16s ease; }
.nav-pop-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; font-size: 13px; color: var(--text-2); white-space: nowrap; }
.nav-pop .theme-select { max-width: 132px; background: var(--hover); color: var(--text); border-color: var(--input-border); }
.nav-pop .theme-select:hover { background: var(--hover); }
.nav-pop-sep { height: 1px; background: var(--border); margin: 10px -14px; }
.nav-pop-logout { width: 100%; background: none; border: none; color: var(--danger); font-size: 13px; cursor: pointer; padding: 7px; border-radius: 8px; transition: background .15s ease; }
.nav-pop-logout:hover { background: var(--danger-bg); }
.container { max-width: 1080px; margin: 24px auto; padding: 0 16px; }
.container.wide { max-width: 1440px; }
.card { background: var(--card); border-radius: 14px; padding: 20px 22px; box-shadow: var(--card-shadow); margin-bottom: 16px; }
.btn { background: var(--primary); color: var(--on-primary); border: none; border-radius: 8px; padding: 9px 18px; font-size: 14px; cursor: pointer; transition: background .15s ease, transform .1s ease, box-shadow .15s ease; }
.btn:hover:not(:disabled) { background: var(--primary-hover); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { background: var(--card); color: var(--text-2); border: 1px solid var(--border); }
.btn.ghost:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn.danger { background: var(--danger); }
.btn.danger:hover:not(:disabled) { background: var(--danger); filter: brightness(.88); }
.input, textarea, select { width: 100%; border: 1px solid var(--input-border); border-radius: 8px; padding: 9px 12px; font-size: 14px; font-family: inherit; background: var(--input-bg); color: var(--text); transition: border-color .15s ease, box-shadow .15s ease; }
.input:focus, textarea:focus, select:focus { outline: 2px solid var(--primary-border); border-color: var(--primary); }
label.field { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 12px; }
label.field span { display: block; margin-bottom: 5px; font-weight: 600; }
.ask-box { display: flex; gap: 10px; margin-top: 4px; }
.ask-box textarea { flex: 1; resize: vertical; min-height: 64px; }
.route-chain { background: var(--primary-soft); border: 1px solid var(--primary-border); color: var(--primary-text); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; margin: 14px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.route-chain .degraded { color: var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 1px 8px; font-size: 12px; }
.candidate { border: 1px solid var(--border-soft); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; transition: border-color .15s ease, box-shadow .15s ease; }
.candidate:hover { border-color: var(--primary-border); box-shadow: 0 2px 12px rgba(15,23,42,.06); }
.candidate .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.candidate .q { font-weight: 700; font-size: 14.5px; }
.candidate .score { color: var(--primary); font-size: 13px; white-space: nowrap; }
.candidate .meta { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.candidate details { margin-top: 8px; }
.candidate summary { cursor: pointer; font-size: 13px; color: var(--primary); }
.candidate .body { font-size: 13.5px; color: var(--text-2); margin-top: 8px; white-space: pre-wrap; line-height: 1.7; }
.candidate .actions { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
.fb-useful { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
.fb-useless { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
.empty-new { background: var(--miss-bg); border: 1px solid var(--miss-border); color: var(--warn); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; }
.step-card { background: var(--th-bg); border: 1px solid var(--border-soft); border-radius: 10px; padding: 10px 14px; margin-top: 10px; font-size: 13px; }
.step-card.running { background: var(--primary-soft); border-color: var(--primary-border); }
.step-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.engine-badge { border-radius: 6px; padding: 1px 8px; font-size: 11.5px; font-weight: 600; }
.engine-badge.llm { background: var(--success-bg); color: var(--success); }
.engine-badge.keyword { background: var(--warn-bg); color: var(--warn); }
.engine-badge.none { background: var(--hover); color: var(--text-2); }
.step-ms { font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.step-body { color: var(--text-2); line-height: 1.7; font-size: 12.5px; }
.step-body .dim { color: var(--text-3); }
.trace-details { margin-top: 12px; }
.trace-details summary { cursor: pointer; font-size: 12.5px; color: var(--text-2); }
.trace-pre { background: var(--pre-bg); color: var(--pre-text); border-radius: 10px; padding: 12px; font-size: 11.5px; line-height: 1.6; overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin-top: 8px; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--card); border-radius: 12px; padding: 16px; text-align: center; box-shadow: var(--card-shadow); }
.stat .num { font-size: 26px; font-weight: 800; color: var(--text); }
.stat .lbl { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border-soft); }
th { color: var(--text-2); font-weight: 600; background: var(--th-bg); }
/* QA 表格：列分隔线 + 列宽可拖动 */
.qa-table { table-layout: fixed; }
.qa-table th, .qa-table td { border-right: 1px solid var(--border-soft); overflow: hidden; }
.qa-table th:last-child, .qa-table td:last-child { border-right: none; }
.qa-table th { position: relative; user-select: none; }
.col-grip { position: absolute; top: 0; right: -4px; width: 9px; height: 100%; cursor: col-resize; z-index: 2; }
.col-grip:hover { background: linear-gradient(90deg, transparent, var(--primary-border)); }
/* 题库管理：左栏（分类上 / 标签下），固定一屏高，两侧独立滚动 */
.tree-col { position: sticky; top: 80px; align-self: start; height: calc(100vh - 104px); min-height: 420px; background: var(--card); border-radius: 14px; padding: 14px; box-shadow: var(--card-shadow); display: flex; flex-direction: column; gap: 12px; }
.tree-half { flex: 1; min-height: 0; display: flex; flex-direction: column; }
/* 分类:标签 默认 6:4，可拖拽行分隔条调整 */
.tree-half.cat-half { flex: 6; }
.tree-half.tag-half { flex: 4; }
/* 分类/标签之间的水平拖拽条 */
.row-resizer { height: 10px; margin: -6px -4px; cursor: row-resize; z-index: 5; border-radius: 6px; position: relative; flex-shrink: 0; }
.row-resizer::after { content: ''; position: absolute; left: 30%; right: 30%; top: 4.5px; height: 2px; border-radius: 2px; background: transparent; transition: background .15s; }
.row-resizer:hover::after, .row-resizer.dragging::after { background: var(--primary); }
.icon-btn.tiny { font-size: 9px; padding: 1px 3px; color: var(--text-3); }
.icon-btn.tiny:hover:not(:disabled) { color: var(--primary); }
.icon-btn.tiny:disabled { opacity: .25; cursor: default; }
.tree-half .section-title { margin-bottom: 6px; }
.tree-scroll { flex: 1; min-height: 0; overflow-y: auto; padding-right: 2px; }
/* 左栏右缘拖拽调宽手柄（= QA列表左侧边框） */
.col-resizer { position: absolute; top: 4px; bottom: 4px; right: -11px; width: 10px; cursor: col-resize; z-index: 5; border-radius: 6px; }
.col-resizer:hover, .col-resizer.dragging { background: var(--primary-soft); }
.l1-item { margin-bottom: 1px; }
.l1-head { display: flex; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 8px; font-weight: 600; font-size: 12.5px; cursor: pointer; }
.l1-head:hover { background: var(--hover); }
.l1-head .arrow { transition: .15s; font-size: 10px; color: var(--text-3); cursor: pointer; flex-shrink: 0; padding: 2px; }
.l1-head .arrow.open { transform: rotate(90deg); }
.l1-head .cat-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.l1-head .cnt { font-size: 11px; color: var(--text-3); white-space: nowrap; flex-shrink: 0; }
.l2-item { display: flex; justify-content: space-between; align-items: center; gap: 4px; padding: 3px 6px 3px 20px; border-radius: 8px; font-size: 12px; color: var(--text-2); cursor: pointer; }
.l2-item:hover { background: var(--hover); }
.l2-item.active { background: var(--primary-soft); color: var(--primary-text); font-weight: 600; }
.l2-item .cat-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.l2-item .cnt { font-size: 11px; color: var(--text-3); flex-shrink: 0; }
.l2-item.add-cat { color: var(--primary); font-size: 12px; }
.l2-item.add-cat:hover { background: var(--primary-soft); }
.icon-btn { background: none; border: none; cursor: pointer; color: var(--text-3); font-size: 14px; padding: 2px 5px; border-radius: 5px; transition: background .15s ease, color .15s ease; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.manage-grid { display: grid; grid-template-columns: 300px 1fr; gap: 16px; }
@media (max-width: 1080px) { .manage-grid { grid-template-columns: 1fr !important; } .col-resizer { display: none; } .tree-col { position: static; height: auto; } .tree-half { max-height: 45vh; } }
.drawer-mask { position: fixed; inset: 0; background: var(--mask); z-index: 20; display: flex; justify-content: flex-end; }
.drawer { background: var(--card); width: min(560px, 92vw); height: 100%; overflow-y: auto; padding: 24px; }
.drawer h3 { margin-bottom: 16px; font-size: 17px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.form-grid .full { grid-column: 1 / -1; }
.modal-mask { position: fixed; inset: 0; background: var(--mask); z-index: 30; display: flex; align-items: center; justify-content: center; }
.modal { background: var(--card); border-radius: 14px; padding: 22px 24px; width: min(440px, 92vw); }
/* toast 通知 */
.toast-wrap { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--card); color: var(--text); border: 1px solid var(--border); border-left: 3px solid var(--primary); border-radius: 10px; padding: 9px 18px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.12); max-width: min(480px, 90vw); }
.toast.success { border-left-color: var(--success); color: var(--success); }
.toast.error { border-left-color: var(--danger); color: var(--danger); }
.toast.warn { border-left-color: var(--warn); color: var(--warn); }
.toast-enter-active, .toast-leave-active { transition: all .25s ease; }
.toast-enter-from { opacity: 0; transform: translateY(-12px); }
.toast-leave-to { opacity: 0; transform: translateY(-8px); }
.bubble-chart .row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
.bubble-chart .bar-wrap { flex: 1; background: var(--hover); border-radius: 6px; height: 18px; overflow: hidden; }
.bubble-chart .bar { height: 100%; background: var(--primary); border-radius: 6px; transition: width .4s ease; }
.err { color: var(--danger); font-size: 13px; margin-top: 8px; }
.ok-tip { color: var(--success); font-size: 13px; }
.section-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
.section-title h3 { font-size: 16px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.section-title h3 .filter-desc { font-size: 12px; color: var(--text-3); font-weight: 400; }
.btn-group { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.btn-group .btn { white-space: nowrap; }
.settings-grid { display: grid; grid-template-columns: 1fr; gap: 0; }
.tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 8px 12px; }
.tag-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--hover); border: 1px solid var(--border-soft); color: var(--text-2); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; user-select: none; transition: border-color .15s ease, background .15s ease, color .15s ease; }
.tag-chip:hover { border-color: var(--primary); }
.tag-chip.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-text); font-weight: 600; }
.tag-chip .tag-cnt { font-size: 11px; color: var(--text-3); background: var(--border-soft); border-radius: 999px; padding: 0 6px; }
.tag-chip .tag-ops { display: none; }
.tag-chip:hover .tag-ops { display: inline-flex; }
.tag-chip.mini { font-size: 11px; padding: 1px 8px; cursor: default; }
.tag-select { display: flex; flex-wrap: wrap; gap: 8px; border: 1px solid var(--input-border); border-radius: 8px; padding: 10px; }
.tag-check { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text-2); background: var(--th-bg); border: 1px solid var(--border-soft); border-radius: 999px; padding: 3px 10px; cursor: pointer; transition: all .15s ease; }
.tag-check.on { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-text); }
.l1-head .active, .l1-head span.active { color: var(--primary-text); font-weight: 700; }
.l1-item.active .l1-head { background: var(--primary-soft); }
.alias-rows { display: flex; flex-direction: column; gap: 8px; }
.alias-row { display: flex; align-items: center; gap: 8px; }
.alias-row .alias-num { font-size: 12px; color: var(--text-2); white-space: nowrap; min-width: 58px; }
.alias-row .input { flex: 1; }
/* ============ 过渡与状态 ============ */
.nav button.page-btn, .nav .logout { transition: background .15s ease, color .15s ease; }
@keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.container > div { animation: pageIn .22s ease; }
@keyframes emptyBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.empty-cta { text-align: center; padding: 26px 12px; }
.empty-cta .icon { font-size: 30px; display: inline-block; animation: emptyBounce 2.4s ease-in-out infinite; }
.empty-cta .tip { font-size: 13px; color: var(--text-3); margin: 8px 0 12px; }
/* ============ 移动端适配 ============ */
@media (max-width: 720px) {
  .container { margin: 12px auto; padding: 0 10px; }
  .card { padding: 14px 12px; overflow-x: auto; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .stat .num { font-size: 20px; }
  .nav { padding: 0 10px; gap: 2px; }
  .nav .brand { font-size: 13px; margin-right: 8px; }
  .nav button.page-btn { padding: 8px 9px; font-size: 13px; }
  th, td { padding: 7px 8px; font-size: 12.5px; }
  .drawer { width: 100vw; }
}
</style>
</head>
<body>
<div id="app">
  <!-- 登录 -->
  <div v-if="!token" class="login-wrap">
    <div class="login-card">
      <h2>个人知识库</h2>
      <p>面试 FAQ · 三级检索匹配 · 复盘闭环</p>
      <label class="field"><span>用户名</span><input class="input" v-model="loginForm.username" @keyup.enter="doLogin"></label>
      <label class="field"><span>密码</span><input class="input" type="password" v-model="loginForm.password" @keyup.enter="doLogin"></label>
      <div class="err" v-if="loginErr">{{ loginErr }}</div>
      <button class="btn" style="width:100%;margin-top:6px" @click="doLogin" :disabled="loggingIn">{{ loggingIn ? '登录中…' : '登录' }}</button>
    </div>
  </div>

  <template v-else>
  <!-- 顶部导航 -->
  <div class="nav">
    <span class="brand">📘 个人知识库</span>
    <button class="page-btn" :class="{active: page==='match'}" @click="page='match'">面试问答</button>
    <button class="page-btn" :class="{active: page==='manage'}" @click="goManage">题库管理</button>
    <button class="page-btn" :class="{active: page==='stats'}" @click="goStats">复盘统计</button>
    <button class="page-btn" :class="{active: page==='settings'}" @click="goSettings">⚙ 设置</button>
    <span class="spacer"></span>
    <template v-if="page==='manage'">
      <select class="kb-select" v-model="kbId" @change="onKbSwitch" title="切换题库">
        <option v-for="k in kbs" :key="k.id" :value="k.id">{{ k.name }}（{{ k.qa_count }}题）</option>
      </select>
      <button class="kb-op" @click="openKbNew" title="新建题库">＋</button>
      <button class="kb-op" @click="openKbEdit(currentKb)" :disabled="!currentKb" title="编辑 / 删除当前题库">✏️</button>
    </template>
    <!-- 外观/账号菜单（汉堡） -->
    <div class="nav-menu">
      <button class="nav-burger" :class="{open: navMenuOpen}" @click="navMenuOpen=!navMenuOpen" title="主题 / 字体 / 退出">
        <span></span><span></span><span></span>
      </button>
      <div v-if="navMenuOpen" class="nav-pop-mask" @click="navMenuOpen=false"></div>
      <div v-if="navMenuOpen" class="nav-pop">
        <div class="nav-pop-row">
          <span>🎨 界面主题</span>
          <select class="theme-select" :value="theme" @change="setTheme($event.target.value)">
            <option value="slate">⬜ 雾灰</option>
            <option value="mint">🌿 薄荷</option>
            <option value="sky">☁️ 晴空</option>
            <option value="sakura">🌸 樱粉</option>
            <option value="cream">🍮 奶杏</option>
            <option value="dark">🌙 夜读</option>
          </select>
        </div>
        <div class="nav-pop-row">
          <span>✒️ 字体风格</span>
          <select class="theme-select" :value="font" @change="setFont($event.target.value)">
            <option value="system">默认字体</option>
            <option value="heiti">现代黑体</option>
            <option value="songti">宋体阅读</option>
            <option value="kaiti">楷体温润</option>
            <option value="yuan">圆润可爱</option>
          </select>
        </div>
        <div class="nav-pop-sep"></div>
        <button class="nav-pop-logout" @click="logout">退出登录</button>
      </div>
    </div>
  </div>

  <div class="container" :class="{wide: page==='manage'}">
    <!-- 匹配页 -->
    <div v-if="page==='match'">
      <div class="card">
        <div class="section-title"><h3>请输入您的问题：</h3>
          <span style="flex:1"></span>
          <span style="font-size:12px;color:var(--text-3)">全知识库检索</span>
        </div>
        <div class="ask-box">
          <textarea v-model="question" placeholder="例如：你的项目里检索不准是怎么优化的？" @keydown.enter.exact.prevent="doMatch" title="Enter 直接匹配，Shift+Enter 换行"></textarea>
        </div>
        <div style="display:flex;gap:10px;align-items:center;margin-top:10px">
          <label style="font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:6px">
            返回条数
            <select v-model="topK" style="width:90px;padding:5px 8px;font-size:12.5px">
              <option value="">默认</option>
              <option value="1">1</option><option value="2">2</option><option value="3">3</option>
              <option value="5">5</option><option value="8">8</option>
            </select>
          </label>
          <span style="flex:1"></span>
          <button class="btn" @click="doMatch" :disabled="matching || !question.trim()">{{ matching ? '匹配中…' : '匹配' }}</button>
        </div>
        <div class="err" v-if="matchErr">{{ matchErr }}</div>

        <!-- 实时进度：每一步做什么、用什么引擎、耗时 -->
        <div v-if="matching && !matchSteps.length" class="step-card running">⏳ ① 全库关键词直配中…（毫秒级，命中则免后续步骤）</div>
        <div v-for="s in matchSteps" :key="s.stage" class="step-card" :class="{running: s._running}">
          <div class="step-head">
            <b>{{ s.label }}</b>
            <span class="engine-badge" :class="s.engine">{{ s.engineLabel }}</span>
            <span style="flex:1"></span>
            <span class="step-ms">{{ s.ms != null ? s.ms + ' ms' : '进行中…' }}</span>
          </div>
          <div class="step-body" v-html="s.text"></div>
        </div>
      </div>

      <div v-if="matchResult" class="card">
        <div class="route-chain">
          <b>路由</b>
          <span>{{ matchResult.route.intent_name || '全库检索' }}</span>
          <span v-if="matchResult.route.kb_names?.length" style="font-size:12.5px;color:var(--primary)">→ 检索库：{{ matchResult.route.kb_names.join('、') }}</span>
          <span>confidence {{ (matchResult.route.confidence ?? 0).toFixed(2) }}</span>
          <span v-if="matchResult.route.degraded" class="degraded">关键词兜底（LLM 不可用）</span>
          <span style="color:#6370a3;font-size:12px">{{ matchResult.route.reason }}</span>
        </div>

        <div v-for="c in matchResult.matched" :key="c.qa_id" class="candidate">
          <div class="head"><span class="q">{{ c.question }}</span><span class="score">score {{ (c.score ?? 0).toFixed(2) }}</span></div>
          <div class="meta">被问 {{ c.hit_count }} 次 · {{ c.reason }}</div>
          <details>
            <summary>展开答案 / 追问 / STAR 要点</summary>
            <div class="body"><b>答案</b>\n{{ c.answer }}</div>
            <div class="body" v-if="c.follow_ups"><b>常见追问</b>\n{{ c.follow_ups }}</div>
            <div class="body" v-if="c.star_hint"><b>STAR 要点</b>\n{{ c.star_hint }}</div>
          </details>
          <div class="actions">
            <button class="btn sm fb-useful" @click="sendFeedback('useful')">👍 有用</button>
            <button class="btn sm fb-useless" @click="sendFeedback('useless')">👎 没用</button>
            <button class="btn sm ghost" @click="copyText([c.answer, c.follow_ups ? '常见追问：' + c.follow_ups : '', c.star_hint ? 'STAR 要点：' + c.star_hint : ''].filter(Boolean).join('\n'))">📋 复制答案</button>
            <span class="ok-tip" v-if="feedbackDone[c.qa_id]">已记录</span>
          </div>
        </div>

        <div v-if="matchResult.free_answer" class="candidate" style="border-left:3px solid #f59e0b">
          <div class="head"><span class="q">🤖 模型生成回答</span><span class="score" style="color:var(--warn)">非题库答案</span></div>
          <div class="meta">三级检索均未命中 · 宽松模式下由大模型用自身知识回答，仅供参考</div>
          <div class="body" style="white-space:pre-wrap">{{ matchResult.free_answer }}</div>
          <div class="actions"><button class="btn sm ghost" @click="copyText(matchResult.free_answer)">📋 复制回答</button></div>
        </div>

        <div v-if="matchResult.source==='new' && !matchResult.free_answer" class="empty-new">
          <div>题库还没有覆盖这个问题，已记录到<b>查询日志</b>。</div>
          <div style="font-size:12px;margin-top:6px;color:var(--warn)" v-html="noMatchReason"></div>
        </div>

        <details v-if="matchResult.trace" class="trace-details">
          <summary>🔍 查看完整匹配过程（参数 / 各阶段耗时 / 被过滤的候选）</summary>
          <pre class="trace-pre">{{ traceText }}</pre>
        </details>
      </div>
    </div>

    <!-- 题库管理页 -->
    <div v-if="page==='manage'" class="manage-grid" :style="{gridTemplateColumns: leftWidth + 'px 1fr'}">
      <div class="tree-col">
        <div class="col-resizer" :class="{dragging: resizing}" @mousedown="startResize" title="左右拖动调整宽度"></div>
        <div class="tree-half cat-half" :style="{flex: catFlex}">
          <div class="section-title"><h3>分类</h3><button class="btn sm ghost" @click="openCatEdit(null, null)">＋分类</button></div>
          <div class="tree-scroll">
            <div class="l1-item" :class="{active: filterCategoryId==='all'}" @click="filterCategoryId='all';loadQas()">
              <div class="l1-head"><span style="flex:1">全部分类</span><span class="cnt">{{ catTotalCount }}题</span></div>
            </div>
            <div v-for="c in categories" :key="c.id" class="l1-item">
              <div class="l1-head">
                <span class="arrow" :class="{open: expandedCats[c.id]}" @click="toggleCat(c.id)" title="展开/收起二级分类">▶</span>
                <span class="cat-name" :class="{active: filterCategoryId===c.id}" :title="c.name" @click="filterCategoryId=c.id;loadQas()">{{ c.name }}</span>
                <span class="cnt">{{ c.qa_count + c.children.reduce((s,x)=>s+x.qa_count,0) }}题</span>
                <button class="icon-btn" @click.stop="openCatEdit(c, null)">✏️</button>
                <button class="icon-btn" @click.stop="delCat(c)">🗑</button>
              </div>
              <div v-show="expandedCats[c.id]">
                <div v-for="(child, ci) in (c.children || [])" :key="child.id" class="l2-item" :class="{active: filterCategoryId===child.id}" @click="filterCategoryId=child.id;loadQas()">
                  <span style="display:flex;align-items:center;gap:1px;flex-shrink:0">
                    <button class="icon-btn tiny" :disabled="ci===0" @click.stop="moveCat(child,'up')" title="上移">▲</button>
                    <button class="icon-btn tiny" :disabled="ci===(c.children||[]).length-1" @click.stop="moveCat(child,'down')" title="下移">▼</button>
                  </span>
                  <span class="cat-name" :title="child.name">{{ child.name }}</span>
                  <span style="display:flex;gap:2px;align-items:center;flex-shrink:0">
                    <span class="cnt">{{ child.qa_count }}题</span>
                    <button class="icon-btn" @click.stop="openCatEdit(child, c)">✏️</button>
                    <button class="icon-btn" @click.stop="delCat(child)">🗑</button>
                  </span>
                </div>
                <div class="l2-item add-cat" @click.stop="openCatEdit(null, c)">＋ 新增二级分类</div>
              </div>
            </div>
            <div v-if="!categories.length" style="color:var(--text-3);font-size:13px;padding:12px">还没有分类，点击右上角创建</div>
          </div>
        </div>

        <div class="row-resizer" :class="{dragging: resizingRow}" @mousedown="startRowResize" title="上下拖动调整分类/标签占比"></div>

        <div class="tree-half tag-half" :style="{flex: tagFlex}">
          <div class="section-title"><h3>标签</h3><button class="btn sm ghost" @click="openTagEdit(null)">＋标签</button></div>
          <div class="tree-scroll">
            <div class="l2-item" :class="{active: filterTagId==='all'}" style="padding-left:8px" @click="filterTagId='all';loadQas()">
              <span>全部</span>
            </div>
            <div class="tag-cloud">
              <span v-for="t in tags" :key="t.id" class="tag-chip" :class="{active: filterTagId===t.id}" @click="filterTagId = filterTagId===t.id ? 'all' : t.id; loadQas()">
                {{ t.name }}<span class="tag-cnt">{{ t.usage_count }}</span>
                <span class="tag-ops" @click.stop>
                  <button class="icon-btn" style="font-size:11px;padding:0 2px" @click="openTagEdit(t)">✏️</button>
                  <button class="icon-btn" style="font-size:11px;padding:0 2px" @click="delTag(t)">✕</button>
                </span>
              </span>
            </div>
            <div v-if="!tags.length" style="color:var(--text-3);font-size:13px;padding:0 0 12px 12px">还没有标签</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">
          <h3>QA 列表 <span class="filter-desc">{{ qaFilterDesc }}</span></h3>
          <div class="btn-group">
            <input class="input" style="width:180px" placeholder="🔍 关键词" v-model="keyword" @keyup.enter="loadQas()">
            <button class="btn sm ghost" @click="resetFilter">重置</button>
            <button class="btn sm ghost" @click="openImport">📥 批量导入</button>
            <button class="btn sm" @click="openQaEdit(null)">＋ 新增QA</button>
          </div>
        </div>
        <table class="qa-table">
          <thead><tr>
            <th :style="colStyle(0)" style="width:26px"><span class="col-grip" @mousedown="startColResize($event,0)"></span></th>
            <th :style="colStyle(1)"><span class="col-grip" @mousedown="startColResize($event,1)"></span>问题</th>
            <th :style="colStyle(2)"><span class="col-grip" @mousedown="startColResize($event,2)"></span>分类</th>
            <th :style="colStyle(3)"><span class="col-grip" @mousedown="startColResize($event,3)"></span>标签</th>
            <th :style="colStyle(4)"><span class="col-grip" @mousedown="startColResize($event,4)"></span>被问</th>
            <th :style="colStyle(5)"><span class="col-grip" @mousedown="startColResize($event,5)"></span>操作</th>
          </tr></thead>
          <tbody>
            <template v-for="qa in qas" :key="qa.id">
              <tr>
                <td style="text-align:center"><button class="icon-btn" @click="expandedQas[qa.id]=!expandedQas[qa.id]" :title="expandedQas[qa.id]?'收起答案':'展开答案'">{{ expandedQas[qa.id] ? '▾' : '▸' }}</button></td>
                <td style="max-width:280px">{{ qa.question }}</td>
                <td style="white-space:nowrap;font-size:12.5px">{{ qa.category_l1 ? (qa.category_l2 ? qa.category_l2 : qa.category_l1) : '—' }}</td>
                <td style="max-width:160px">
                  <span v-for="t in qa.tags" :key="t.id" class="tag-chip mini">{{ t.name }}</span>
                  <span v-if="!qa.tags?.length" style="color:var(--text-3)">—</span>
                </td>
                <td>{{ qa.hit_count }}</td>
                <td style="white-space:nowrap">
                  <button class="icon-btn" @click="openQaEdit(qa)">✏️</button>
                  <button class="icon-btn" @click="delQa(qa)">🗑</button>
                </td>
              </tr>
              <tr v-if="expandedQas[qa.id]" style="background:var(--th-bg)">
                <td></td>
                <td colspan="5" style="padding:8px 12px;white-space:pre-wrap;font-size:12.5px;color:var(--text);border-left:3px solid var(--primary)">{{ qa.answer || '（无答案）' }}</td>
              </tr>
            </template>
            <tr v-if="!qas.length"><td colspan="6" style="color:var(--text-3);text-align:center;padding:24px">当前筛选条件下暂无 QA，点击右上角新增或批量导入</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 系统设置页 -->
    <div v-if="page==='settings'" class="settings-grid">
      <div class="card">
        <div class="section-title"><h3>⚙ 匹配参数</h3><span v-if="settingsSaved" class="ok-tip">已保存</span></div>
        <p style="font-size:12px;color:var(--text-3);margin:0 0 12px 2px;line-height:1.6">
          保存后立即生效（存服务器数据库，无需重启）。阈值调高 → 更严格、宁可进新问题池；调低 → 更容易出候选。<br>
          检索漏斗：① 关键词直配 → ② 向量检索 → ③ 关键词检索 → ④ 向量兜底+LLM核验 → 严格/宽松分支。</p>
        <div class="form-grid">
          <label class="field"><span>答案模式 answer_mode（严格=未命中提示暂无答案；宽松=大模型用自身知识回答）</span>
            <select class="input" v-model="settingsForm.answer_mode">
              <option value="strict">严格模式 strict</option>
              <option value="loose">宽松模式 loose</option>
            </select></label>
          <label class="field"><span>关键词直配线 keyword_direct_score（默认 0.7，全库重合度≥此值直接命中）</span>
            <input class="input" type="number" step="0.05" min="0" max="1" v-model="settingsForm.keyword_direct_score"></label>
          <label class="field"><span>向量检索标准阈值 vector_match_score（默认 0.72，相似度≥此值直接命中）</span>
            <input class="input" type="number" step="0.01" min="0" max="1" v-model="settingsForm.vector_match_score"></label>
          <label class="field"><span>关键词检索命中线 keyword_match_min_score（默认 0.7）</span>
            <input class="input" type="number" step="0.05" min="0" max="1" v-model="settingsForm.keyword_match_min_score"></label>
          <label class="field"><span>向量兜底阈值 vector_fallback_score（默认 0.55，低于标准线时的二次打捞）</span>
            <input class="input" type="number" step="0.01" min="0" max="1" v-model="settingsForm.vector_fallback_score"></label>
          <label class="field"><span>向量兜底候选数 vector_top_k（默认 5，捞回后交 LLM 核验）</span>
            <input class="input" type="number" step="1" min="1" max="10" v-model="settingsForm.vector_top_k"></label>
          <label class="field"><span>默认返回条数 default_top_k（1~10）</span>
            <input class="input" type="number" step="1" min="1" max="10" v-model="settingsForm.default_top_k"></label>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;align-items:center">
          <span v-if="vectorStatus" style="font-size:12px;color:var(--text-3)">向量库：{{ vectorStatus.total }} 条 · 待更新 {{ vectorStatus.stale }} 条 · 模型 {{ vectorStatus.model }}</span>
          <button class="btn ghost" @click="rebuildVectors" :disabled="rebuilding">{{ rebuilding ? '重建中…' : '🔄 重建向量库' }}</button>
          <button class="btn" @click="saveSettings" :disabled="settingsSaving">{{ settingsSaving ? '保存中…' : '保存参数' }}</button>
        </div>
      </div>
    </div>

    <!-- 复盘统计页 -->
    <div v-if="page==='stats'">
      <div class="stat-grid">
        <div class="stat"><div class="num">{{ overview.qa_total }}</div><div class="lbl">题库总数</div></div>
        <div class="stat"><div class="num">{{ overview.query_total }}</div><div class="lbl">累计提问</div></div>
        <div class="stat"><div class="num" style="color:var(--success)">{{ overview.hit }}</div><div class="lbl">命中次数</div></div>
        <div class="stat"><div class="num" style="color:var(--miss)">{{ overview.new }}</div><div class="lbl">未命中</div></div>
        <div class="stat"><div class="num">{{ overview.hit_rate==null ? '—' : (overview.hit_rate*100).toFixed(0)+'%' }}</div><div class="lbl">命中率</div></div>
      </div>
      <div class="card bubble-chart">
        <div class="section-title"><h3>🏆 Top10 知识库-分类（按累计被问）</h3></div>
        <div v-for="(h, i) in topCategories" :key="i" class="row">
          <span style="width:52px;font-size:12px;color:var(--primary);font-weight:700">{{ h.hits }}次</span>
          <div class="bar-wrap"><div class="bar" :style="{width: (h.hits / topCategories[0].hits * 100) + '%'}"></div></div>
          <span style="width:42%;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ h.kb_name }} › {{ h.category_name }}（{{ h.qa_count }}题）</span>
        </div>
        <div v-if="!topCategories.length" class="empty-cta">
          <span class="icon">🏆</span>
          <div class="tip">还没有被问记录 · 提问命中后这里会亮起来</div>
          <button class="btn sm" @click="page='match'">去提问</button>
        </div>
      </div>
      <div class="card bubble-chart">
        <div class="section-title"><h3>🏷 Top10 知识库-标签（按累计被问）</h3></div>
        <div v-for="(h, i) in topTags" :key="i" class="row">
          <span style="width:52px;font-size:12px;color:var(--primary);font-weight:700">{{ h.hits }}次</span>
          <div class="bar-wrap"><div class="bar" :style="{width: (h.hits / topTags[0].hits * 100) + '%'}"></div></div>
          <span style="width:42%;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ h.kb_name }} › #{{ h.tag_name }}（{{ h.qa_count }}题）</span>
        </div>
        <div v-if="!topTags.length" class="empty-cta">
          <span class="icon">🏷</span>
          <div class="tip">还没有标签命中记录 · 提问命中后这里会亮起来</div>
          <button class="btn sm" @click="page='match'">去提问</button>
        </div>
      </div>

      <div class="card">
        <div class="section-title">
          <h3>🕘 历史问题记录 <span style="font-size:12px;color:var(--text-3);font-weight:400">共 {{ records.length }} 条 · 垃圾数据可删除</span></h3>
        </div>
        <table>
          <thead><tr><th style="width:44%">问题</th><th>结果</th><th>时间</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="r in records" :key="r.id">
              <td style="max-width:380px">{{ r.question }}</td>
              <td style="white-space:nowrap;font-size:12.5px">
                <span v-if="r.source==='match'" style="color:var(--success)" :title="r.matched_question || ''">✓ 命中</span>
                <span v-else-if="r.source==='converted'" style="color:var(--primary)" :title="'已转正为 QA：' + (r.matched_question || '')">✔ 已转QA</span>
                <span v-else-if="r.source==='generated'" style="color:#d97706">🤖 模型回答</span>
                <span v-else style="color:var(--miss)">✗ 未命中</span>
              </td>
              <td style="white-space:nowrap;color:var(--text-3);font-size:12.5px">{{ r.created_at }}</td>
              <td style="white-space:nowrap">
                <template v-if="confirmDelLog !== r.id">
                  <button class="icon-btn" title="彻底删除该记录" @click="confirmDelLog = r.id">🗑</button>
                </template>
                <template v-else>
                  <button class="btn sm danger" @click="delRecord(r)">确认删除</button>
                  <button class="btn sm ghost" @click="confirmDelLog = null">取消</button>
                </template>
              </td>
            </tr>
            <tr v-if="!records.length"><td colspan="4">
              <div class="empty-cta">
                <span class="icon">🕘</span>
                <div class="tip">还没有提问记录 · 去匹配页问第一个问题吧</div>
                <button class="btn sm" @click="page='match'">去提问</button>
              </div>
            </td></tr>
          </tbody>

  <!-- 新建 / 编辑知识库 -->

        <span v-else></span>
        <div style="display:flex;gap:10px">
          <button class="btn ghost" @click="kbModal=false">取消</button>

  <div v-if="catModal" class="modal-mask" @click.self="catModal=false">

      <label class="field" v-if="!catForm.id"><span>父分类（一级留空；二级选择一级分类）</span>
        <select class="input" v-model="catForm.parent_id">

      </label>
      <p v-if="catForm.id" style="font-size:12px;color:var(--text-3);margin-bottom:12px">
        编辑时不改层级；删除分类会连带删除其子分类，QA 本身保留（分类置空）。</p>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn ghost" @click="catModal=false">取消</button>
        <button class="btn" @click="saveCat" :disabled="!catForm.name.trim()">保存</button>

  <!-- 标签编辑 -->
  <div v-if="tagModal" class="modal-mask" @click.self="tagModal=false">
    <div class="modal">
      <h3 style="margin-bottom:14px">{{ tagForm.id ? '编辑标签' : '新增标签' }}</h3>

      <div style="display:flex;gap:10px;justify-content:flex-end">

  <!-- QA 抽屉 -->
  <div v-if="qaModal" class="drawer-mask" @click.self="qaModal=false">
    <div class="drawer">
      <h3>{{ qaForm.id ? '编辑 QA' : '新增 QA' }}</h3>
      <div class="form-grid">
        <label class="field"><span>所属知识库</span>
          <select class="input" v-model="qaForm.kb_id" @change="onQaFormKbChange">
            <option v-for="k in kbs" :key="k.id" :value="k.id">{{ k.name }}</option>

        </label>
        <label class="field"><span>分类</span>
          <select class="input" v-model="qaForm.category_id" title="默认跟随左侧当前选中的分类">
            <option :value="null">（未分类）</option>
            <option v-for="o in catOptions(qaForm.kb_id)" :key="o.id" :value="o.id">{{ o.label }}</option>
          </select>
        </label>
        <label class="field full"><span>标准问题 *</span><input class="input" v-model="qaForm.question"></label>
        <label class="field full"><span>标签（可多选）</span>
          <div class="tag-select">
            <label v-for="t in tags" :key="t.id" class="tag-check" :class="{on: qaForm.tag_ids.includes(t.id)}">
              <input type="checkbox" :value="t.id" v-model="qaForm.tag_ids"> {{ t.name }}
            </label>
            <span v-if="!tags.length" style="font-size:12.5px;color:var(--text-3)">还没有标签，可在左侧标签区创建</span>
          </div>
        </label>
        <label class="field full"><span>答案 *</span><textarea class="input" rows="6" v-model="qaForm.answer"></textarea></label>
        <label class="field full"><span>变体问法（泛化匹配关键，一行一个）</span>
          <div class="alias-rows">
            <div v-for="(a, i) in qaForm.aliasRows" :key="i" class="alias-row">
              <span class="alias-num">{{ i === 0 ? '变体问法' : `变体问法${i + 1}` }}</span>
              <input class="input" v-model="qaForm.aliasRows[i]" placeholder="同一问题的其他问法">
              <button v-if="i > 0" type="button" class="icon-btn" @click="qaForm.aliasRows.splice(i, 1)">✕</button>
            </div>
            <button type="button" class="btn sm ghost" @click="qaForm.aliasRows.push('')">＋ 变体问法</button>
          </div>
        </label>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
        <button class="btn ghost" @click="qaModal=false">取消</button>
        <button class="btn" @click="saveQa">保存</button>
      </div>
    </div>
  </div>

  <!-- Markdown 批量导入抽屉 -->
  <div v-if="importModal" class="drawer-mask" @click.self="importModal=false">
    <div class="drawer" style="width:min(680px,94vw)">
      <h3>📥 Markdown 批量导入</h3>
      <p style="font-size:12.5px;color:var(--text-2);line-height:1.7;margin-bottom:10px">
        格式：<code># 一级分类</code>（不存在会自动创建）·
        <code>## 问题</code>（→ QA）· 字段行 <code>- 标签: / - 别名: / - 答案: / - 追问: / - STAR: / - 质量:</code>（标签逗号/顿号分隔，别名可多行）·
        其余正文自动追加到答案。同库同问题自动跳过。
        <a href="#" @click.prevent="importExample" style="color:var(--primary)">填入示例</a>
      </p>
      <label class="field"><span>粘贴 Markdown 或选择文件</span>
        <textarea class="input" rows="10" v-model="importText" placeholder="# 技术原理&#10;> RAG、LLM等技术&#10;&#10;## 1、如何优化RAG召回&#10;- 别名: rag检索差怎么办&#10;- 答案: 先诊断再优化&#10;- 质量: 4"></textarea>
      </label>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
        <input type="file" ref="importFile" accept=".md,.markdown,.txt" @change="onImportFile" style="font-size:12.5px">
        <span style="font-size:12px;color:var(--text-3)">.md / .txt</span>
      </div>
      <div v-if="importPreview" class="route-chain" style="background:var(--success-bg);border-color:var(--success-border);color:var(--success)">
        <b>预览</b><span>共 {{ importPreview.total }} 题 / {{ importPreview.sections.length }} 个大类</span>
        <span v-for="s in importPreview.sections" :key="s.name" style="font-size:12px">{{ s.name }}({{ s.count }})</span>
        <span v-if="importPreview.errors.length" style="color:var(--warn)">⚠ {{ importPreview.errors.length }} 条警告</span>
      </div>
      <div v-if="importResult" class="route-chain" :style="importResult.failed ? 'background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger)' : 'background:var(--success-bg);border-color:var(--success-border);color:var(--success)'">
        <b>结果</b>
        <span>导入 {{ importResult.imported }} · 跳过已存在 {{ importResult.skipped_exist }} · 失败 {{ importResult.failed }}</span>
        <span v-if="importResult.created_categories">新建分类 {{ importResult.created_categories }}</span>
        <span v-if="importResult.created_tags">新建标签 {{ importResult.created_tags }}</span>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn ghost" @click="importModal=false">关闭</button>
        <button class="btn ghost" @click="previewImport" :disabled="!importText.trim()">校验预览</button>
        <button class="btn" @click="doImport" :disabled="!importText.trim() || importing">{{ importing ? '导入中…' : '确认导入' }}</button>
      </div>
    </div>
  </div>

  <!-- 全局确认弹窗（替代原生 confirm） -->
  <div v-if="confirmBox.open" class="modal-mask" style="z-index:60" @click.self="resolveConfirm(false)">
    <div class="modal" style="max-width:400px;animation:pageIn .18s ease">
      <h3 style="margin-bottom:10px">确认操作</h3>
      <p style="margin:0 0 16px;color:var(--text);font-size:13.5px;line-height:1.7">{{ confirmBox.msg }}</p>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn ghost" @click="resolveConfirm(false)">取消</button>
        <button class="btn danger" @click="resolveConfirm(true)">确定</button>
      </div>
    </div>
  </div>

  <!-- 全局 toast 通知（替代原生 alert） -->
  <div class="toast-wrap" aria-live="polite">
    <transition-group name="toast">
      <div v-for="t in toasts" :key="t.id" class="toast" :class="t.type">{{ t.msg }}</div>
    </transition-group>
  </div>
</template>
</div><!-- /#app -->

<script>
const { createApp } = Vue;
const API = '';
createApp({
  data() {
    return {
      token: localStorage.getItem('token') || '',
      theme: localStorage.getItem('uiTheme') || 'slate',
      font: localStorage.getItem('uiFont') || 'system',
      loginForm: { username: '', password: '' }, loginErr: '', loggingIn: false,
      page: 'match',
      kbs: [], kbId: null,
      question: '', matching: false, matchErr: '', matchResult: null, feedbackDone: {},
      topK: '', matchSteps: [],
      settingsSaving: false, settingsSaved: false, settingsForm: {},
      vectorStatus: null, rebuilding: false,
      categories: [], expandedCats: {}, filterCategoryId: 'all', catsByKb: {},
      tags: [], filterTagId: 'all',
      qas: [], keyword: '',
      qaColWidths: (() => { try { return JSON.parse(localStorage.getItem('qaColWidths')) || []; } catch { return []; } })(),
      leftWidth: parseInt(localStorage.getItem('manageLeftWidth')) || 300, resizing: false,
      catFlex: parseFloat(localStorage.getItem('catFlex')) || 6,
      tagFlex: parseFloat(localStorage.getItem('tagFlex')) || 4,
      resizingRow: false,
      expandedQas: {},
      overview: {}, topCategories: [], topTags: [], records: [], confirmDelLog: null,
      kbModal: false, kbEditId: null, kbForm: { name: '', description: '', is_default: false },
      catModal: false, catForm: { id: null, kb_id: null, parent_id: null, name: '' },
      tagModal: false, tagForm: { id: null, name: '' },
      qaModal: false, qaForm: {},
      importModal: false, importText: '', importPreview: null, importResult: null, importing: false,
      fromLogModal: false, fromLogForm: {},
      toasts: [], toastSeq: 0,
      navMenuOpen: false,
      confirmBox: { open: false, msg: '', _resolve: null },
    };
  },
  computed: {
    currentKb() { return this.kbs.find(k => k.id === this.kbId); },
    catTotalCount() {
      return this.categories.reduce((s, c) => s + c.qa_count + (c.children || []).reduce((x, y) => x + y.qa_count, 0), 0);
    },
    qaFilterDesc() {
      const parts = [this.currentKb?.name || ''];
      if (this.filterCategoryId !== 'all') {
        const c = this.findCategory(this.filterCategoryId);
        if (c) parts.push(c.parentName ? `${c.parentName} ▸ ${c.name}` : c.name);
      }
      if (this.filterTagId !== 'all') {
        const t = this.tags.find(t => t.id === this.filterTagId);
        if (t) parts.push(`#${t.name}`);
      }
      if (this.keyword) parts.push(`"${this.keyword}"`);
      return parts.filter(Boolean).join(' · ');
    },
    traceText() {
      const t = this.matchResult?.trace;
      return t ? JSON.stringify(t, null, 2) : '';
    },
    noMatchReason() {
      const t = this.matchResult?.trace;
      if (!t) return '';
      const parts = [];
      if (t.prematch?.best_score !== undefined) {
        parts.push(`① 关键词直配：全库 ${t.prematch.pool_size} 题最高重合度 ${t.prematch.best_score} < 直配线 ${t.prematch.threshold}`);
      }
      if (t.vector) {
        if (t.vector.available === false) parts.push(`② 向量检索不可用：${t.vector.reason || '未就绪'}`);
        else if (t.vector.hits?.length) {
          const best = t.vector.hits[0];
          parts.push(`② 向量检索：最高相似度 ${best[1]} < 标准阈值 ${t.params.vector_match_score}`);
        } else parts.push('② 向量检索：无候选');
      }
      if (t.keyword) {
        parts.push(`③ 关键词检索：最高重合度 ${t.keyword.best_score} < 命中线 ${t.keyword.threshold}`);
      }
      if (t.fallback_vector) {
        if (t.fallback_vector.available === false) parts.push(`④ 向量兜底不可用`);
        else if (t.fallback_vector.hits?.length) {
          const best = t.fallback_vector.hits[0];
          const okN = (t.verify?.results || []).filter(r => r[1]).length;
          parts.push(`④ 向量兜底：最高 ${best[1]} ≥ ${t.params.vector_fallback_score} 捞回 ${t.fallback_vector.hits.length} 条，⑤ LLM 核验可回答 ${okN} 条`);
        } else parts.push(`④ 向量兜底：全部 < ${t.params.vector_fallback_score}，无候选`);
      }
      return parts.join('；');
    },
  },
  watch: {
    // hash 路由记忆：页面切换同步到 URL，刷新/收藏不丢状态
    page(v) {
      this.navMenuOpen = false;  // 切页自动收起汉堡菜单
      try {
        const h = '#/' + v;
        if (location.hash !== h) history.replaceState(null, '', h);
      } catch (e) { /* file:// 等环境忽略 */ }
    },
  },
  async mounted() {
    document.documentElement.dataset.theme = this.theme;  // 恢复上次主题
    document.documentElement.dataset.font = this.font;    // 恢复上次字体
    window.addEventListener('hashchange', this.onHashChange);
    if (this.token) { await this.initData(); this.onHashChange(); }  // 登录态下恢复上次页面
  },
  methods: {
    setTheme(t) { this.theme = t; localStorage.setItem('uiTheme', t); document.documentElement.dataset.theme = t; },
    setFont(f) { this.font = f; localStorage.setItem('uiFont', f); document.documentElement.dataset.font = f; },
    onHashChange() {
      if (!this.token) return;
      const p = (location.hash || '').replace(/^#\//, '');
      const routes = {
        match: () => { this.page = 'match'; },
        manage: () => this.goManage(),
        stats: () => this.goStats(),
        settings: () => this.goSettings(),
      };
      if (routes[p] && p !== this.page) routes[p]();
    },
    async api(method, url, body) {
      const opt = { method, headers: { 'Authorization': 'Bearer ' + this.token, 'Content-Type': 'application/json' } };
      if (body !== undefined) opt.body = JSON.stringify(body);
      const resp = await fetch(API + url, opt);
      if (resp.status === 401) { this.token = ''; localStorage.removeItem('token'); throw new Error('登录已过期'); }
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.detail || ('请求失败 ' + resp.status));
      return data;
    },
    async doLogin() {
      this.loggingIn = true; this.loginErr = '';
      try {
        const r = await fetch(API + '/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(this.loginForm) });
        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || '登录失败');
        this.token = data.token; localStorage.setItem('token', data.token);
        await this.initData();
        this.onHashChange();
      } catch (e) { this.loginErr = e.message; } finally { this.loggingIn = false; }
    },
    logout() { this.token = ''; localStorage.removeItem('token'); this.page = 'match'; },
    async initData() {
      await this.loadKbs();
      await this.loadSettings();
      await this.loadCategories();
      await this.loadTags();
    },
    async loadKbs() {
      this.kbs = await this.api('GET', '/api/kbs');
      const saved = parseInt(localStorage.getItem('kbId'));
      const found = this.kbs.find(k => k.id === saved);
      this.kbId = found ? found.id : (this.kbs.find(k => k.is_default) || this.kbs[0])?.id;
    },
    onKbSwitch() {
      localStorage.setItem('kbId', this.kbId);
      this.qas = [];
      this.filterCategoryId = 'all';
      this.filterTagId = 'all';
      this.loadCategories();
      if (this.page === 'manage') this.loadQas();
    },
    async loadCategories() {
      if (!this.kbId) return;
      this.categories = await this.api('GET', '/api/categories?kb_id=' + this.kbId);
      this.categories.forEach(c => {
        c.children.forEach(ch => { ch.parentName = c.name; });
      });
    },
    toggleCat(id) { this.expandedCats[id] = !this.expandedCats[id]; },
    findCategory(id) {
      for (const c of this.categories) {
        if (c.id === id) return c;
        const ch = (c.children || []).find(x => x.id === id);
        if (ch) return ch;
      }
      return null;
    },
    async loadCatsFor(kbId) {
      // 分类按库缓存（QA 表单/转正抽屉切换库时用）
      if (!kbId || this.catsByKb[kbId]) return;
      if (kbId === this.kbId) { this.catsByKb[kbId] = this.categories; return; }
      try { this.catsByKb[kbId] = await this.api('GET', '/api/categories?kb_id=' + kbId); }
      catch (e) { this.catsByKb[kbId] = []; }
    },
    catsOf(kbId) {
      if (kbId === this.kbId) return this.categories;
      return this.catsByKb[kbId] || [];
    },
    catOptions(kbId) {
      // 扁平树状选项：一级直接可选，二级缩进显示（不重复父级名）
      const list = [];
      for (const c of this.catsOf(kbId)) {
        list.push({ id: c.id, label: c.name });
        for (const ch of (c.children || [])) list.push({ id: ch.id, label: '\u3000└ ' + ch.name });
      }
      return list;
    },
    async loadTags() {
      this.tags = await this.api('GET', '/api/tags');
    },
    async doMatch() {
      this.matching = true; this.matchErr = ''; this.matchResult = null; this.feedbackDone = {}; this.matchSteps = [];
      try {
        const resp = await fetch(API + '/api/match/stream', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + this.token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ kb_id: this.kbId, question: this.question, top_k: this.topK ? parseInt(this.topK) : null }),
        });
        if (resp.status === 401) { this.token = ''; localStorage.removeItem('token'); throw new Error('登录已过期'); }
        if (!resp.ok || !resp.body) { const d = await resp.json().catch(() => ({})); throw new Error(d.detail || ('请求失败 ' + resp.status)); }
        const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf('\n\n')) >= 0) {
            const chunk = buf.slice(0, idx).trim(); buf = buf.slice(idx + 2);
            if (!chunk.startsWith('data: ')) continue;
            this.onMatchEvent(JSON.parse(chunk.slice(6)));
          }
        }
      } catch (e) { this.matchErr = e.message; } finally { this.matching = false; }
    },
    onMatchEvent(evt) {
      if (evt.stage === 'error') { this.matchErr = evt.data.detail || '匹配失败'; return; }
      if (evt.stage === 'done') {
        // 兜底：所有阶段均已结束，补齐缺失的耗时，避免卡片停留在"进行中…"
        this.matchSteps.forEach(s => { if (s.ms == null) s.ms = 0; });
        this.matchResult = evt.data;
        return;
      }
      const d = evt.data;
      let label = '', engineLabel = '', text = '';
      if (evt.stage === 'prematch') {
        label = '① 关键词直配';
        engineLabel = d.engine === 'none' ? '无' : '全库字符匹配';
        const hit = d.kept ? `命中 ${d.kept} 个，直接返回（免后续步骤）` : `最高重合度 ${d.best_score ?? '-'} < 直配线 ${d.threshold ?? '-'}，进入向量检索`;
        text = `扫描全库 ${d.pool_size} 个 QA（${d.ms ?? '-'} ms） · ${hit}`;
        this.matchSteps.push({ stage: evt.stage, label, engine: d.engine === 'none' ? 'none' : 'keyword', engineLabel, ms: d.ms, text });
      } else if (evt.stage === 'vector') {
        label = '② 向量检索';
        if (!d.available) {
          text = `<span class="dim">向量引擎不可用：${d.reason || '未就绪'}，跳过进入关键词检索</span>`;
          this.matchSteps.push({ stage: evt.stage, label, engine: 'none', engineLabel: '不可用', ms: d.ms, text });
        } else {
          engineLabel = '语义相似度';
          const hits = d.hits || [];
          const passed = d.passed_hint || '';
          const hitText = hits.length
            ? hits.map(h => `#${h[0]} ${h[1]}`).join('、')
            : '无候选';
          text = `向量库 ${d.pool_size} 条 · top${d.top_k}：${hitText}`;
          this.matchSteps.push({ stage: evt.stage, label, engine: 'vector', engineLabel, ms: d.ms, text });
        }
      } else if (evt.stage === 'keyword') {
        label = '③ 关键词检索';
        engineLabel = '二元组重合度';
        const hits = d.hits || [];
        const hitText = hits.length ? hits.map(h => `#${h[0]} ${h[1]}`).join('、') : '无候选';
        text = `扫描 ${d.pool_size} 个 QA · 命中 ${d.kept ?? hits.length} 个（阈值 ${d.threshold}）：${hitText}`;
        this.matchSteps.push({ stage: evt.stage, label, engine: 'keyword', engineLabel, ms: d.ms, text });
      } else if (evt.stage === 'fallback_vector') {
        label = '④ 向量兜底';
        if (!d.available) {
          text = `<span class="dim">向量引擎不可用：${d.reason || '未就绪'}</span>`;
          this.matchSteps.push({ stage: evt.stage, label, engine: 'none', engineLabel: '不可用', ms: d.ms, text });
        } else {
          engineLabel = '低阈值语义';
          const hits = d.hits || [];
          const hitText = hits.length ? hits.map(h => `#${h[0]} ${h[1]}`).join('、') : `全部 < ${d.threshold}，无候选`;
          text = `阈值 ${d.threshold} · top${d.top_k}：${hitText}`;
          this.matchSteps.push({ stage: evt.stage, label, engine: 'vector', engineLabel, ms: d.ms, text });
        }
      } else if (evt.stage === 'verify') {
        label = '⑤ LLM 核验';
        if (d.error) {
          text = `<span class="dim">核验失败：${d.error}</span>`;
          this.matchSteps.push({ stage: evt.stage, label, engine: 'none', engineLabel: '失败', ms: d.ms, text });
        } else {
          engineLabel = 'LLM 判断';
          const rs = d.results || [];
          const okN = rs.filter(r => r[1]).length;
          const detail = rs.map(r => `#${r[0]} ${r[1] ? '✓' : '✗'} ${r[2]}`).join('、');
          text = `候选 ${rs.length} 个 → 可回答 ${okN} 个${detail ? `<br><span class="dim">${detail}</span>` : ''}`;
          this.matchSteps.push({ stage: evt.stage, label, engine: 'llm', engineLabel, ms: d.ms, text });
        }
      } else if (evt.stage === 'free_answer') {
        label = '⑥ 宽松模式自答';
        if (d.skipped === 'strict') {
          text = `<span class="dim">严格模式：不生成模型回答，提示暂无答案</span>`;
          this.matchSteps.push({ stage: evt.stage, label, engine: 'none', engineLabel: '跳过', ms: 0, text });
        } else if (d.ok) {
          this.matchSteps.push({ stage: evt.stage, label: '⑥ 宽松模式自答', engine: 'llm', engineLabel: '模型生成', ms: d.ms, text: '已用模型自身知识生成回答（见下方答案区）' });
        }
      }
    },
    async loadSettings() {
      try { this.settingsForm = JSON.parse(JSON.stringify(await this.api('GET', '/api/settings'))); } catch (e) { /* 忽略 */ }
    },
    async saveSettings() {
      this.settingsSaving = true; this.settingsSaved = false;
      try {
        await this.api('PUT', '/api/settings', { values: this.settingsForm });
        this.settingsSaved = true;
        setTimeout(() => { this.settingsSaved = false; }, 2000);
      } catch (e) { this.showToast(e.message, 'error'); } finally { this.settingsSaving = false; }
    },
    async sendFeedback(fb) {
      await this.api('POST', `/api/log/${this.matchResult.log_id}/feedback`, { feedback: fb });
      this.matchResult.matched.forEach(c => this.feedbackDone[c.qa_id] = true);
    },
    goManage() { this.page = 'manage'; this.loadCategories(); this.loadTags(); this.loadQas(); this.defaultSelectFirstCat(); },
    // 默认选中第一个一级分类（仅当当前是"全部"且存在分类时）
    defaultSelectFirstCat() {
      this.$nextTick(() => {
        if (this.filterCategoryId === 'all' && this.categories.length) {
          this.filterCategoryId = this.categories[0].id;
          this.expandedCats[this.categories[0].id] = true;
          this.loadQas();
        }
      });
    },
    // 分类/标签占比拖拽：按总份数 10，最小 2 份
    startRowResize(e) {
      e.preventDefault();
      this.resizingRow = true;
      const bar = e.currentTarget;
      const catEl = bar.previousElementSibling;
      const startY = e.clientY;
      const startH = catEl.getBoundingClientRect().height;
      const totalH = catEl.parentElement.getBoundingClientRect().height - 22; // 减去拖拽条等
      const move = (ev) => {
        const delta = ev.clientY - startY;
        const ratio = Math.min(0.9, Math.max(0.15, (startH + delta) / totalH));
        this.catFlex = Math.round(ratio * 100);
        this.tagFlex = 100 - this.catFlex;
      };
      const up = () => {
        this.resizingRow = false;
        localStorage.setItem('catFlex', this.catFlex);
        localStorage.setItem('tagFlex', this.tagFlex);
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    },
    async moveCat(cat, direction) {
      try {
        await this.api('POST', `/api/categories/${cat.id}/move?direction=${direction}`);
        await this.loadCategories();
      } catch (e) { this.showToast(e.message, 'error'); }
    },
    // 拖动左栏右缘（= QA列表左边框）调整两栏宽度，240~640px，记忆到本地
    startResize(e) {
      e.preventDefault();
      this.resizing = true;
      const startX = e.clientX, startW = this.leftWidth;
      const move = (ev) => { this.leftWidth = Math.min(640, Math.max(240, startW + ev.clientX - startX)); };
      const up = () => {
        this.resizing = false;
        localStorage.setItem('manageLeftWidth', this.leftWidth);
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    },
    goStats() { this.page = 'stats'; this.loadStats(); },
    async goSettings() {
      this.page = 'settings';
      await Promise.all([this.loadSettings(), this.loadTags(), this.loadCategories()]);
      this.loadVectorStatus();
    },
    async loadVectorStatus() {
      try { this.vectorStatus = await this.api('GET', '/api/vectors/status'); } catch (e) { /* 忽略 */ }
    },
    async rebuildVectors() {
      if (!(await this.askConfirm('全量重建向量库？QA 数量多时会调用相应次数的 embedding API（通常几秒内完成）。'))) return;
      this.rebuilding = true;
      try {
        const r = await this.api('POST', '/api/vectors/rebuild');
        this.showToast(`重建完成：共 ${r.total} 条向量`, 'success');
        this.loadVectorStatus();
      } catch (e) { this.showToast('重建失败：' + e.message, 'error'); } finally { this.rebuilding = false; }
    },
    async loadQas() {
      if (!this.kbId) return;
      let url = `/api/qas?kb_id=${this.kbId}`;
      if (this.filterCategoryId !== 'all') url += `&category_id=${this.filterCategoryId}`;
      if (this.filterTagId !== 'all') url += `&tag_id=${this.filterTagId}`;
      if (this.keyword) url += `&q=${encodeURIComponent(this.keyword)}`;
      this.qas = await this.api('GET', url);
    },
    resetFilter() {
      this.keyword = ''; this.filterCategoryId = 'all'; this.filterTagId = 'all';
      this.loadQas();
    },
    async loadStats() {
      const [ov, topCats, topTags, records] = await Promise.all([
        this.api('GET', '/api/stats/overview'),
        this.api('GET', '/api/stats/top_categories'),
        this.api('GET', '/api/stats/top_tags'),
        this.api('GET', '/api/stats/records'),
      ]);
      this.overview = ov; this.topCategories = topCats; this.topTags = topTags; this.records = records;
    },
    openKbNew() { this.kbEditId = null; this.kbForm = { name: '', description: '', is_default: false }; this.kbModal = true; },
    openKbEdit(k) { this.kbEditId = k.id; this.kbForm = { name: k.name, description: k.description || '', is_default: !!k.is_default }; this.kbModal = true; },
    async delKb(k) {
      if (await this.askConfirm(`删除知识库「${k.name}」及其全部 ${k.qa_count} 题？不可恢复！`)) {
        try {
          this.kbModal = false;
          await this.api('DELETE', `/api/kbs/${k.id}`);
          await this.loadKbs();
          this.kbId = this.kbs[0]?.id;
          this.showToast('知识库已删除', 'success');
        }
        catch (e) { this.showToast(e.message, 'error'); }
      }
    },
    async delKbFromModal() {
      const k = this.kbs.find(x => x.id === this.kbEditId);
      if (k) await this.delKb(k);
    },
    async saveKb() {
      try {
        let newId = null;
        if (this.kbEditId) await this.api('PUT', `/api/kbs/${this.kbEditId}`, this.kbForm);
        else { const r = await this.api('POST', '/api/kbs', this.kbForm); newId = r.id; }
        this.kbModal = false;
        await this.loadKbs();
        if (newId) { this.kbId = newId; this.onKbSwitch(); this.showToast(`题库「${this.kbForm.name}」已创建`, 'success'); }
        else this.showToast('知识库已保存', 'success');
      } catch (e) { this.showToast(e.message, 'error'); }
    },
    openImport() { this.importModal = true; this.importPreview = null; this.importResult = null; },
    importExample() {
      this.importText = `# 技术原理
> RAG、LLM、向量库等技术问题

## 1、如何优化 RAG 召回不准的问题
- 标签: 高频题, RAG
- 别名: rag检索效果差怎么办
- 别名: 召回率低如何提升
- 答案: 先诊断再优化：混合检索（向量+BM25）、优化切块与 overlap、加 rerank 精排、查询改写
- 追问: rerank 模型怎么选
- STAR: 先说诊断思路，再给优化手段，最后量化提升效果
- 质量: 4

正文补充也可以写在这里，会自动追加到答案。

## 2、向量数据库如何选型
- 标签: 选型
- 答案: 看数据规模、运维成本、生态兼容性

# 个人背景

## 请做一个自我介绍
- 标签: 高频题
- 答案: 背景 + 项目亮点 + 与岗位的匹配点，控制在一分钟`;
      this.importPreview = null; this.importResult = null;
    },
    async onImportFile(e) {
      const f = e.target.files[0];
      if (!f) return;
      this.importText = await f.text();
      this.importPreview = null; this.importResult = null;
      e.target.value = '';
    },
    async previewImport() {
      try {
        const r = await this.api('POST', '/api/qas/import-markdown', { kb_id: this.kbId, markdown: this.importText, dry_run: true });
        this.importPreview = { total: r.total, sections: r.sections, errors: r.errors };
        this.importResult = null;
      } catch (e) { this.showToast(e.message, 'error'); }
    },
    async doImport() {
      this.importing = true;
      try {
        this.importResult = await this.api('POST', '/api/qas/import-markdown', { kb_id: this.kbId, markdown: this.importText });
        this.importPreview = null;
        await this.loadCategories();
        await this.loadTags();
        if (this.page === 'manage') await this.loadQas();
      } catch (e) { this.showToast(e.message, 'error'); } finally { this.importing = false; }
    },
    // ---- 分类 ----
    openCatEdit(cat, parent) {
      this.catForm = cat
        ? { id: cat.id, kb_id: this.kbId, parent_id: cat.parent_id, name: cat.name }
        : { id: null, kb_id: this.kbId, parent_id: parent ? parent.id : null, name: '' };
      this.catModal = true;
    },
    async saveCat() {
      try {
        const body = { kb_id: this.catForm.kb_id, parent_id: this.catForm.parent_id, name: this.catForm.name };
        if (this.catForm.id) await this.api('PUT', `/api/categories/${this.catForm.id}`, body);
        else await this.api('POST', '/api/categories', body);
        this.catModal = false;
        await this.loadCategories();
        this.loadQas();
      } catch (e) { this.showToast(e.message, 'error'); }
    },
    async delCat(cat) {
      const msg = cat.parent_id
        ? `删除子分类「${cat.name}」？其下 ${cat.qa_count} 题 QA 保留（分类置空）。`
        : `删除一级分类「${cat.name}」及其 ${(cat.children||[]).length} 个子分类？QA 全部保留（分类置空）。`;
      if (await this.askConfirm(msg)) {
        await this.api('DELETE', `/api/categories/${cat.id}`);
        if (this.filterCategoryId === cat.id) this.filterCategoryId = 'all';
        await this.loadCategories();
        this.loadQas();
        this.showToast('分类已删除', 'success');
      }
    },
    // ---- 标签 ----
    openTagEdit(tag) {
      this.tagForm = tag ? { id: tag.id, name: tag.name } : { id: null, name: '' };
      this.tagModal = true;
    },
    async saveTag() {
      try {
        if (this.tagForm.id) await this.api('PUT', `/api/tags/${this.tagForm.id}`, { name: this.tagForm.name });
        else await this.api('POST', '/api/tags', { name: this.tagForm.name });
        this.tagModal = false;
        await this.loadTags();
        this.loadQas();
      } catch (e) { this.showToast(e.message, 'error'); }
    },
    async delTag(tag) {
      if (await this.askConfirm(`删除标签「${tag.name}」？（只解除关联，QA 保留）`)) {
        await this.api('DELETE', `/api/tags/${tag.id}`);
        if (this.filterTagId === tag.id) this.filterTagId = 'all';
        await this.loadTags();
        this.loadQas();
        this.showToast('标签已删除', 'success');
      }
    },
    openQaEdit(qa) {
      this.qaForm = qa
        ? { ...qa, tag_ids: (qa.tags || []).map(t => t.id),
            aliasRows: this.splitAliases(qa.question_aliases) }
        : { kb_id: this.kbId, tag_ids: [], question: '', aliasRows: [''], answer: '' };
      // 新增：默认用左侧当前选中的分类（编辑：保留原分类）
      if (!qa) {
        if (this.filterCategoryId !== 'all') {
          this.qaForm.category_id = this.filterCategoryId;
        } else if (this.categories.length) {
          this.qaForm.category_id = this.categories[0].id;
        } else {
          this.qaForm.category_id = null;
        }
      }
      this.qaModal = true;
      this.loadCatsFor(this.qaForm.kb_id);
    },
    splitAliases(text) {
      const rows = (text || '').split('\n').map(s => s.trim()).filter(Boolean);
      return rows.length ? rows : [''];
    },
    joinAliases(rows) {
      return (rows || []).map(s => (s || '').trim()).filter(Boolean).join('\n');
    },
    async onQaFormKbChange() {
      await this.loadCatsFor(this.qaForm.kb_id);
      const cats = this.catsOf(this.qaForm.kb_id);
      const valid = !this.qaForm.category_id || this.findInCategories(cats, this.qaForm.category_id);
      if (!valid) this.qaForm.category_id = null;
    },
    findInCategories(cats, id) {
      for (const c of cats) {
        if (c.id === id) return true;
        if ((c.children || []).some(x => x.id === id)) return true;
      }
      return false;
    },
    async saveQa() {
      try {
        const body = { kb_id: this.qaForm.kb_id, category_id: this.qaForm.category_id, tag_ids: this.qaForm.tag_ids || [], question: this.qaForm.question, question_aliases: this.joinAliases(this.qaForm.aliasRows), answer: this.qaForm.answer };
        if (this.qaForm.id) await this.api('PUT', `/api/qas/${this.qaForm.id}`, body);
        else await this.api('POST', '/api/qas', body);
        this.qaModal = false; this.loadQas(); this.loadCategories(); this.loadTags();
      } catch (e) { this.showToast(e.message, 'error'); }
    },
    async delRecord(r) {
      try {
        await this.api('DELETE', `/api/query_log/${r.id}`);
        this.confirmDelLog = null;
        await this.loadStats();  // 同步刷新顶部统计、Top10 和记录列表
        this.showToast(`已彻底删除记录「${r.question.slice(0, 30)}${r.question.length > 30 ? '…' : ''}」`, 'success');
      } catch (e) { this.showToast(e.message, 'error'); }
    },
    async delQa(qa) { if (await this.askConfirm(`删除 QA「${qa.question}」？`)) { await this.api('DELETE', `/api/qas/${qa.id}`); this.showToast('QA 已删除', 'success'); this.loadQas(); this.loadCategories(); this.loadTags(); } },
    // ---- QA 表格列宽拖拽 ----
    colStyle(i) { return this.qaColWidths[i] ? { width: this.qaColWidths[i] + 'px' } : null; },
    startColResize(e, idx) {
      e.preventDefault(); e.stopPropagation();
      const th = e.currentTarget.parentElement;
      const table = th.closest('table');
      const ths = [...table.querySelectorAll('th')];
      const startX = e.clientX, startW = th.getBoundingClientRect().width;
      const move = (ev) => {
        const w = Math.max(36, startW + ev.clientX - startX);
        th.style.width = w + 'px';
      };
      const up = () => {
        this.qaColWidths = ths.map(t => Math.round(t.getBoundingClientRect().width));
        localStorage.setItem('qaColWidths', JSON.stringify(this.qaColWidths));
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    },
    // ---- 全局提示 / 确认 / 复制（P0：替换原生 alert/confirm） ----
    showToast(msg, type = 'info') {
      const id = ++this.toastSeq;
      this.toasts.push({ id, msg, type });
      setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id); }, 3000);
    },
    askConfirm(msg) {
      return new Promise(resolve => { this.confirmBox = { open: true, msg, _resolve: resolve }; });
    },
    resolveConfirm(ok) {
      this.confirmBox.open = false;
      const r = this.confirmBox._resolve;
      this.confirmBox._resolve = null;
      if (r) r(ok);
    },
    async copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        this.showToast('已复制到剪贴板', 'success');
      } catch {
        // 非 HTTPS / 无权限时降级为隐藏 textarea 方案
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); this.showToast('已复制到剪贴板', 'success'); }
        catch { this.showToast('复制失败，请手动选择复制', 'error'); }
        document.body.removeChild(ta);
      }
    },
  },
}).mount('#app');
</script>
